[project]
name = "maestro"
version = "0.1.0"
description = "The music brain behind Ouralia's generative music"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["mido", "numpy"]   # numpy: the clip player's own sounds (synth.py)

[project.optional-dependencies]
spike = ["torch==2.7.1+cu126"]   # optional PC spike; official cu126 wheel index (docs/s1-runtime.md)
data = ["music21==9.9.2"]   # library only; never its bundled corpus
test = ["pytest", "pytest-xdist", "psutil"]   # psutil: -n auto counts real cores, not hyperthreads

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["data/*.json", "data/styles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"     # every core; -n 0 for one process (a debugger, a print)
