# Maestro's tests on every push (task 3.8). The parity and sync tests skip here (no Ouralia build beside the repo),
# and the clip tests skip without a soundfont.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -rs
